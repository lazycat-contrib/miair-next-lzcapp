version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: miair-next
build:
  toolchains: []
  run_buildscript: false
images:
  - id: miair-next
    target: service
    service: miair-next
    source: docker.io/mrdeer1997/miair-next
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: MiAir Next
    summary: 让小米小爱音箱化身DLNA渲染器和AirPlay接收器，并附带一个现代化的Web管理后台
